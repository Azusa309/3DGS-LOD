<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3DGS-LOD · A/B viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 6px; }
  #ui label { display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; background: #222; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 2px 6px; }
  .tag { position: fixed; bottom: 10px; padding: 4px 8px; background: rgba(0,0,0,.6); border-radius: 4px; }
  #tagA { left: 10px; } #tagB { right: 10px; }
  #divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff8; display: none; }
  #stats { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c" aria-label="Gaussian splat viewer"></canvas>
<div id="divider"></div>
<div id="ui" role="toolbar" aria-label="Viewer controls">
  <label>A <select id="selA" aria-label="Left asset"></select></label>
  <label>B <select id="selB" aria-label="Right asset"></select></label>
  <label>View <select id="mode" aria-label="View mode">
    <option value="split">split A | B</option><option value="a">A only</option><option value="b">B only</option>
  </select></label>
  <button id="bench" type="button">Benchmark (10 s)</button>
  <span id="stats" aria-live="polite"></span>
</div>
<div class="tag" id="tagA"></div><div class="tag" id="tagB"></div>

<script type="module">
import * as pc from './vendor/playcanvas.mjs';

// Fixed LOD levels exported from each Streamed SOG (see demo/README.md).
// All assets are DTU scan6, same teacher. lod1 = 50%, lod2 = 25%, lod3 = 10% of 1,484,725 Gaussians.
const ASSETS = {
  'teacher':       { file: 'sog/teacher.sog',                label: 'teacher 100%' },
  'ours_lod1':     { file: 'sog/lodkit_repro_lod1.sog',      label: '3DGS-LOD 50%' },
  'ours_lod2':     { file: 'sog/lodkit_repro_lod2.sog',      label: '3DGS-LOD 25%' },
  'ours_lod3':     { file: 'sog/lodkit_repro_lod3.sog',      label: '3DGS-LOD 10%' },
  'recov_lod1':    { file: 'sog/fair_official_raw_lod1.sog', label: 'splat-transform -d + recovery 50%' },
  'recov_lod2':    { file: 'sog/fair_official_raw_lod2.sog', label: 'splat-transform -d + recovery 25%' },
  'recov_lod3':    { file: 'sog/fair_official_raw_lod3.sog', label: 'splat-transform -d + recovery 10%' },
  'default_lod1':  { file: 'sog/default_lod1.sog',           label: 'splat-transform -d 50%' },
  'default_lod2':  { file: 'sog/default_lod2.sog',           label: 'splat-transform -d 25%' },
  'default_lod3':  { file: 'sog/default_lod3.sog',           label: 'splat-transform -d 10%' },
};

const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
for (const sel of [$('selA'), $('selB')]) {
  for (const [k, v] of Object.entries(ASSETS)) sel.add(new Option(v.label, k));
}
$('selA').value = q.get('a') ?? 'ours_lod2';
$('selB').value = q.get('b') ?? 'default_lod1';
$('mode').value = q.get('mode') ?? 'split';

const canvas = $('c');
const device = await pc.createGraphicsDevice(canvas, {
  deviceTypes: q.get('api') === 'webgl2' ? ['webgl2'] : ['webgpu', 'webgl2'],
  antialias: false,
});
const app = new pc.AppBase(canvas);
const opts = new pc.AppOptions();
opts.graphicsDevice = device;
opts.componentSystems = [pc.RenderComponentSystem, pc.CameraComponentSystem, pc.GSplatComponentSystem];
opts.resourceHandlers = [pc.TextureHandler, pc.ContainerHandler, pc.GSplatHandler];
app.init(opts);
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
device.maxPixelRatio = Number(q.get('dpr') ?? 1);   // fixed DPR so results are comparable
window.addEventListener('resize', () => app.resizeCanvas());
app.start();

// One layer per side so each camera renders exactly one asset.
const world = app.scene.layers.getLayerByName('World');
const layerA = new pc.Layer({ name: 'A' }), layerB = new pc.Layer({ name: 'B' });
app.scene.layers.push(layerA); app.scene.layers.push(layerB);

// Real held-out camera (cameras.json, exported from the COLMAP scene in gsplat's
// normalised frame). OpenCV camera axes (x right, y down, z forward) are mapped
// to PlayCanvas (x right, y up, looks down -z): right = x, up = -y, back = -z.
// ROT_Z: extra rotation of the splat entity about world Z, to absorb a possible
// axis flip in splat-transform's PLY convention (Transform.PLY = Z 180°); chosen
// by comparing a render against the real photo of the same view.
const camsJson = await (await fetch('cameras.json')).json();
const ROT_Z = Number(q.get('rotz') ?? 0);
const view = camsJson.views[Number(q.get('view') ?? 0)];
const center = new pc.Vec3(...camsJson.center);
const m = view.c2w;
const base = {
  right: new pc.Vec3(m[0][0], m[1][0], m[2][0]),
  up: new pc.Vec3(-m[0][1], -m[1][1], -m[2][1]),
  back: new pc.Vec3(-m[0][2], -m[1][2], -m[2][2]),
  pos: new pc.Vec3(m[0][3], m[1][3], m[2][3]),
};
const baseMat = new pc.Mat4();
baseMat.data.set([base.right.x, base.right.y, base.right.z, 0, base.up.x, base.up.y, base.up.z, 0,
                  base.back.x, base.back.y, base.back.z, 0, 0, 0, 0, 1]);
const baseRot = new pc.Quat().setFromMat4(baseMat);
const baseOffset = new pc.Vec3().sub2(base.pos, center);

function makeCam(layer) {
  const e = new pc.Entity();
  e.addComponent('camera', { clearColor: new pc.Color(0, 0, 0), layers: [layer.id], fov: view.fov_y,
                             nearClip: 0.01, farClip: 100 });
  app.root.addChild(e);
  return e;
}
const camA = makeCam(layerA), camB = makeCam(layerB);

// Orbit around the object centre, starting exactly at the real camera.
// yaw: about the view's up axis; pitch: about its right axis; dist: multiplier.
const orbit = { yaw: Number(q.get('yaw') ?? 0), pitch: Number(q.get('pitch') ?? 0), dist: Number(q.get('dist') ?? 1) };
let autoRotate = q.get('spin') !== '0';
const _qy = new pc.Quat(), _qp = new pc.Quat(), _qr = new pc.Quat(), _rot = new pc.Quat(), _off = new pc.Vec3(), _pos = new pc.Vec3();
function placeCams() {
  _qy.setFromAxisAngle(base.up, orbit.yaw);
  _qp.setFromAxisAngle(base.right, orbit.pitch);
  _qr.mul2(_qy, _qp);
  _qr.transformVector(baseOffset, _off).mulScalar(orbit.dist);
  _pos.add2(center, _off);
  _rot.mul2(_qr, baseRot);
  for (const c of [camA, camB]) { c.setPosition(_pos); c.setRotation(_rot); }
}
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; autoRotate = false; });
window.addEventListener('pointerup', () => { drag = null; });
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  orbit.yaw -= (e.clientX - drag[0]) * 0.3;
  orbit.pitch = Math.max(-89, Math.min(89, orbit.pitch - (e.clientY - drag[1]) * 0.3));
  drag = [e.clientX, e.clientY];
});
canvas.addEventListener('wheel', (e) => { orbit.dist = Math.max(0.05, orbit.dist * Math.exp(e.deltaY * 0.001)); e.preventDefault(); }, { passive: false });

// Asset loading, with first-frame timing per side.
const sides = { A: { cam: camA, layer: layerA }, B: { cam: camB, layer: layerB } };
function load(side, key) {
  const s = sides[side];
  s.entity?.destroy();
  s.key = key; s.ready = false; s.t0 = performance.now(); s.loadMs = null;
  $('tag' + side).textContent = ASSETS[key].label + ' · loading…';
  const asset = new pc.Asset(key, 'gsplat', { url: ASSETS[key].file });
  asset.on('load', () => {
    if (s.key !== key) return;
    const e = new pc.Entity();
    e.addComponent('gsplat', { asset, layers: [s.layer.id] });
    e.setLocalEulerAngles(0, 0, ROT_Z);
    app.root.addChild(e);
    s.entity = e;
    s.count = asset.resource?.numSplats ?? asset.resource?.splatData?.numSplats ?? null;
    app.once('frameend', () => {
      s.loadMs = performance.now() - s.t0; s.ready = true;
      $('tag' + side).textContent = `${ASSETS[key].label} · ${s.count?.toLocaleString() ?? '?'} splats · first frame ${s.loadMs.toFixed(0)} ms`;
    });
  });
  asset.on('error', (err) => { $('tag' + side).textContent = ASSETS[key].label + ' · load error: ' + err; });
  app.assets.add(asset); app.assets.load(asset);
}

function applyMode() {
  const m = $('mode').value;
  camA.enabled = m !== 'b'; camB.enabled = m !== 'a';
  camA.camera.rect = m === 'split' ? new pc.Vec4(0, 0, 0.5, 1) : new pc.Vec4(0, 0, 1, 1);
  camB.camera.rect = m === 'split' ? new pc.Vec4(0.5, 0, 0.5, 1) : new pc.Vec4(0, 0, 1, 1);
  $('divider').style.display = m === 'split' ? 'block' : 'none';
  $('tagA').style.display = m === 'b' ? 'none' : ''; $('tagB').style.display = m === 'a' ? 'none' : '';
}
$('selA').onchange = () => load('A', $('selA').value);
$('selB').onchange = () => load('B', $('selB').value);
$('mode').onchange = applyMode;
load('A', $('selA').value); load('B', $('selB').value); applyMode();

// Frame timing. Benchmark = median frame time over 10 s of auto-rotation,
// only meaningful in single-asset mode (A only / B only).
const frames = [];
let bench = null;
app.on('update', (dt) => {
  if (autoRotate || bench) orbit.yaw += dt * 20;
  placeCams();
  frames.push(dt * 1000); if (frames.length > 120) frames.shift();
  const s = [...frames].sort((a, b) => a - b), med = s[s.length >> 1] ?? 0;
  $('stats').textContent = `${device.deviceType} · ${med ? (1000 / med).toFixed(0) : '-'} fps (median of ${s.length})`;
  if (bench) {
    bench.t.push(dt * 1000);
    if (performance.now() - bench.start > 10000) {
      const t = bench.t.slice(30).sort((a, b) => a - b);   // drop warm-up frames
      const r = { mode: $('mode').value, a: sides.A.key, b: sides.B.key, api: device.deviceType,
                  width: device.width, height: device.height, frames: t.length,
                  median_ms: t[t.length >> 1], p95_ms: t[Math.floor(t.length * 0.95)],
                  // Throughput = frames / wall-clock seconds. With vsync off the per-frame dt is
                  // bimodal (pipelined frames) and does not sum to wall time, so median/mean dt mislead.
                  fps: bench.t.length * 1000 / (performance.now() - bench.start),
                  first_frame_ms: { A: sides.A.loadMs, B: sides.B.loadMs }, userAgent: navigator.userAgent };
      window.__bench = r; bench = null;
      $('stats').textContent = `${r.fps.toFixed(0)} fps (frames / wall time), p95 ${r.p95_ms.toFixed(2)} ms`;
      console.log('BENCH', JSON.stringify(r));
    }
  }
});
function startBench() { bench = { start: performance.now(), t: [] }; }
$('bench').onclick = startBench;
window.__ready = () => sides.A.ready && sides.B.ready;
// Deterministic camera control for recording (demo/make_gif.py).
window.__setOrbit = (yaw, pitch = 0, dist = 1) => { autoRotate = false; Object.assign(orbit, { yaw, pitch, dist }); };
// clean=1: hide the toolbar and show only the asset labels (for screenshots / GIFs).
if (q.get('clean') === '1') {
  $('ui').style.display = 'none';
  app.on('update', () => { for (const k of ['A', 'B']) if (sides[k].ready) $('tag' + k).textContent = ASSETS[sides[k].key].label; });
}
window.__startBench = startBench;
if (q.get('bench') === '1') {
  const wait = setInterval(() => { if (window.__ready()) { clearInterval(wait); startBench(); } }, 200);
}
</script>
</body>
</html>
